services:
  backend:
    build:
      context: ./backend
    container_name: aviation-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./aviation_tracker.db
      - JWT_SECRET=aai-aviation-tracker-secret-key-2026
      - JWT_EXPIRATION_HOURS=24
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SIMULATOR_INTERVAL=8
      - SIMULATOR_ENABLED=true
      - AI_ANALYSIS_INTERVAL=30
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=admin123
    volumes:
      # Persist the SQLite database on the host
      - ./backend/data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: aviation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
